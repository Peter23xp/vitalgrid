<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VitalGrid — Architecture Diagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    display: flex;
    justify-content: center;
    padding: 30px;
  }
</style>
</head>
<body>
<svg width="820" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- ── Arrowhead markers ── -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
    <marker id="ah-left" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════ -->
  <!--  TITLE                                         -->
  <!-- ══════════════════════════════════════════════ -->
  <text x="410" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">
    <tspan fill="#2563eb">VitalGrid</tspan> — Architecture Diagram
  </text>
  <text x="410" y="48" text-anchor="middle" font-size="13" fill="#6b7280">
    AWS Databases Hackathon · Medical Supply Chain · June 2026
  </text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  ARROWS  (drawn before boxes so boxes are on top) -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Row 1: Users → CDN -->
  <line x1="152" y1="100" x2="213" y2="100" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- Row 1: CDN → Load Balancer -->
  <line x1="367" y1="100" x2="433" y2="100" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- Load Balancer ↓ Web/API Servers (vertical — centers aligned at x=545) -->
  <line x1="545" y1="132" x2="545" y2="180" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- Auth ↔ Web/API Servers (dashed bidirectional) -->
  <line x1="187" y1="228" x2="413" y2="228"
        stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"
        marker-end="url(#ah)" marker-start="url(#ah-left)"/>
  <text x="300" y="220" text-anchor="middle" font-size="10" fill="#9ca3af">token</text>

  <!-- Fork from Web/API down to 3 children -->
  <!-- vertical stem from WebAPI bottom -->
  <line x1="545" y1="268" x2="545" y2="290" stroke="#9ca3af" stroke-width="1.8"/>
  <!-- horizontal bar -->
  <line x1="178" y1="290" x2="710" y2="290" stroke="#9ca3af" stroke-width="1.8"/>
  <!-- drop to MsgQ -->
  <line x1="178" y1="290" x2="178" y2="312" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- drop to DSQL -->
  <line x1="545" y1="290" x2="545" y2="312" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- drop to DynamoDB -->
  <line x1="710" y1="290" x2="710" y2="312" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- MsgQ ↓ Worker -->
  <line x1="178" y1="398" x2="178" y2="448" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- DSQL --reads--> Worker (dashed) -->
  <line x1="415" y1="358" x2="272" y2="452"
        stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah)"/>
  <text x="332" y="395" text-anchor="middle" font-size="10" fill="#9ca3af">reads</text>

  <!-- Worker → External Services -->
  <line x1="270" y1="479" x2="588" y2="479" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!--  ROW 1 BOXES                                   -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Users (gray) — [20, 70, 132, 60] center x=86 -->
  <rect x="20" y="70" width="132" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="86" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Users</text>
  <text x="86" y="112" text-anchor="middle" font-size="11" fill="#6b7280">Web &amp; mobile clients</text>
  <text x="86" y="125" text-anchor="middle" font-size="11" fill="#6b7280">5 roles</text>

  <!-- CDN (sky) — [213, 70, 154, 60] center x=290 -->
  <rect x="213" y="70" width="154" height="60" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="290" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">CDN</text>
  <text x="290" y="112" text-anchor="middle" font-size="11" fill="#3b82f6">Static assets, caching</text>
  <text x="290" y="125" text-anchor="middle" font-size="11" fill="#3b82f6">Vercel Edge</text>

  <!-- Load Balancer (sky) — [433, 70, 224, 60] center x=545 -->
  <rect x="433" y="70" width="224" height="60" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="545" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Load Balancer / API Gateway</text>
  <text x="545" y="110" text-anchor="middle" font-size="11" fill="#3b82f6">Routing, TLS, rate limits</text>
  <text x="545" y="123" text-anchor="middle" font-size="11" fill="#3b82f6">Next.js Middleware · RBAC</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  ROW 2 BOXES                                   -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Auth Service (pink) — [20, 180, 167, 88] center x=103 -->
  <rect x="20" y="180" width="167" height="88" rx="10" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="103" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">Auth Service</text>
  <text x="103" y="222" text-anchor="middle" font-size="11" fill="#db2777">Sign-in, tokens</text>
  <text x="103" y="237" text-anchor="middle" font-size="11" fill="#db2777">JWT · bcrypt · 5-role RBAC</text>
  <text x="103" y="252" text-anchor="middle" font-size="11" fill="#db2777">httpOnly cookies</text>

  <!-- Web / API Servers (purple) — [413, 180, 264, 88] center x=545 -->
  <rect x="413" y="180" width="264" height="88" rx="10" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="545" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Web / API Servers</text>
  <text x="545" y="222" text-anchor="middle" font-size="11" fill="#7c3aed">Application logic</text>
  <text x="545" y="237" text-anchor="middle" font-size="11" fill="#7c3aed">Next.js 16 · 20 API routes</text>
  <text x="545" y="252" text-anchor="middle" font-size="11" fill="#7c3aed">OCC retry · Repository layer</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  ROW 3 BOXES                                   -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Message Queue (orange) — [88, 312, 180, 86] center x=178 -->
  <rect x="88" y="312" width="180" height="86" rx="10" fill="#ffedd5" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="178" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Message Queue</text>
  <text x="178" y="355" text-anchor="middle" font-size="11" fill="#ea580c">Async jobs</text>
  <text x="178" y="370" text-anchor="middle" font-size="11" fill="#ea580c">Alert notifications</text>
  <text x="178" y="385" text-anchor="middle" font-size="11" fill="#ea580c">Email triggers</text>

  <!-- Aurora DSQL (sky) — [415, 312, 260, 86] center x=545 -->
  <rect x="415" y="312" width="260" height="86" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="545" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Aurora DSQL</text>
  <text x="545" y="355" text-anchor="middle" font-size="11" fill="#3b82f6">Primary data store</text>
  <text x="545" y="370" text-anchor="middle" font-size="11" fill="#3b82f6">12 tables · ACID · Multi-tenant</text>
  <text x="545" y="385" text-anchor="middle" font-size="11" fill="#3b82f6">PostgreSQL-compatible · Serverless</text>

  <!-- DynamoDB (yellow) — [630, 312, 160, 86] center x=710 -->
  <rect x="630" y="312" width="160" height="86" rx="10" fill="#fef9c3" stroke="#fde68a" stroke-width="1.5"/>
  <text x="710" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">DynamoDB</text>
  <text x="710" y="355" text-anchor="middle" font-size="11" fill="#a16207">IoT cold-chain events</text>
  <text x="710" y="370" text-anchor="middle" font-size="11" fill="#a16207">PK: transferId</text>
  <text x="710" y="385" text-anchor="middle" font-size="11" fill="#a16207">SK: timestamp · °C</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  ROW 4 BOXES                                   -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Worker Service (green) — [88, 448, 182, 62] center x=179 -->
  <rect x="88" y="448" width="182" height="62" rx="10" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="179" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Worker Service</text>
  <text x="179" y="492" text-anchor="middle" font-size="11" fill="#059669">Background processing</text>

  <!-- External Services (pink) — [588, 448, 202, 62] center x=689 -->
  <rect x="588" y="448" width="202" height="62" rx="10" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="689" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">External Services</text>
  <text x="689" y="485" text-anchor="middle" font-size="11" fill="#db2777">SendGrid · Email API</text>
  <text x="689" y="500" text-anchor="middle" font-size="11" fill="#db2777">OpenStreetMap · Leaflet</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  OBSERVABILITY BAR                             -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="20" y="538" width="780" height="50" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="410" y="559" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Observability</text>
  <text x="410" y="577" text-anchor="middle" font-size="11" fill="#6b7280">Vercel logs · Aurora DSQL audit_log table · JWT session traces · DynamoDB cold-chain alerts across all services</text>

</svg>
</body>
</html>
